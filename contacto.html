<body>
    <header class="header">
        <div class="top">
            <img src="calavera.jpg" alt="Logo" class="logo" id="subir">
                <a href="historia.html" class="boton">Historia</a>

<form method="get" action="./confirmacion.html">
<br>




<section style="text-align: center;">  
<h1 class="titulos">Contactanos</h1>
<p style="font-size: 25px;">Si tenes alguna consulta acerca del concierto que se va a realizar en tu ciudad, no dudes en contactarnos</p>
</section>

<br><br><br>



<fieldset>
<legend>Enviá tu consulta y enterate de todas las novedades de la gira 2025</legend>

<div class="inputs">
<input type="text" name="Usuario" placeholder="Ingrese usuario" required tabindex="1">
<input type="password" name="Contra" placeholder="Ingrese contraseña" minlength="8" required tabindex="2">
<input type="email" name="Email" placeholder="Ingrese email" required tabindex="3">
<div class="pais">
<select name="pais" id="pais" required>
    <option value="" selected disabled>País</option>
    <option value="Argentina">Argentina</option>
    <option value="Chile">Chile</option>
    <option value="Brasil">Brasil</option>
    <option value="Colombia">Colombia</option>
    <option value="México">México</option>
    <option value="Puerto Rico">Puerto Rico</option>
</select>
</div>
</div>



<div class="consulta" style="display: flex; justify-content: center;">
<label for="mensaje">Consulta: </label>
<textarea name="mensaje" id="mensaje" maxlength="100" rows="5" cols="80" required></textarea>
</div>

<label for="novedades">
<input type="checkbox" name="Novedades" id="novedades" required>
Mantenerse actualizado en las novedades
</label>

<div class="env-ren">
<button type="submit" class="enviar">Enviar</button>
<input type="reset" value="Reinicio" class="enviar">
</div>

</fieldset>
</form>










<footer style="text-align: center;">

    <h4>©Reservados todos los derechos</h4>

</footer>


</body>
</html>
